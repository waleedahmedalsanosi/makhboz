name: Deploy to makhboz.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 159.223.96.246
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/makhboz-app
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            rm -rf .next
            npm install --prefer-offline
            npm run build
            pm2 restart makhboz
            pm2 save
            echo "Deployed at $(date)"
            sleep 3
            echo "=== ENV CHECK ==="
            grep -c SUPABASE /var/www/makhboz-app/.env.local 2>/dev/null && echo ".env.local has Supabase vars" || echo "WARNING: .env.local missing or no Supabase vars"
            echo "=== HEALTH CHECK ==="
            curl -s -o /dev/null -w "Homepage: %{http_code}\n" http://localhost:3000/
            curl -s http://localhost:3000/api/deploy | head -c 200
            echo ""
          script_stop: true
          command_timeout: 5m
