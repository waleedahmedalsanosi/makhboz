name: Deploy to makhboz.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 159.223.96.246
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/makhboz-app
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            cat > .env.local << 'ENVEOF'
            NEXT_PUBLIC_SUPABASE_URL=https://fgdujeijorhjraxipxwc.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnZHVqZWlqb3JoanJheGlweHdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MzE2MDgsImV4cCI6MjA5NDQwNzYwOH0.lMEwOR3sERzp8al2-jWuIw0JoZzuDRNy0bF6hdAWMko
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}
            ENVEOF
            rm -rf .next
            npm install --prefer-offline
            npm run build
            pm2 restart makhboz --update-env
            pm2 save
            echo "Deployed at $(date)"
            sleep 3
            echo "=== HEALTH CHECK ==="
            curl -s -o /dev/null -w "Homepage: %{http_code}\n" http://localhost:3000/
            curl -s http://localhost:3000/api/deploy
            echo ""
          script_stop: true
          command_timeout: 5m
